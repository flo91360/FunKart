name: Construire le jeu

on:
  push:
    branches: ["**"]
    # Une version (Release GitHub avec le jeu) est publiée automatiquement
    # quand un nouveau numéro de version (config/version dans project.godot)
    # arrive sur main. Pousser un tag « v0.1.0 » publie aussi une version.
    tags: ["v*"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  # Bouton « Run workflow » de l'onglet Actions : cocher « publier » sur la
  # branche main crée le tag v<version du projet> et la Release.
  workflow_dispatch:
    inputs:
      publier:
        description: "Publier la version (tag + Release) à partir de main"
        type: boolean
        default: false

concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GODOT_VERSION: 4.4.1

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Historique et tags complets : le changelog d'une version liste les
          # commits depuis le tag précédent.
          fetch-depth: 0

      - name: Version à publier
        id: version
        run: |
          version=$(sed -n 's/^config\/version="\(.*\)"/\1/p' project.godot)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
              echo "::error::Le tag ${GITHUB_REF_NAME} ne correspond pas à la version du jeu (v$version, dans project.godot)."
              exit 1
            fi
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          elif [ "${{ inputs.publier }}" = "true" ]; then
            if [ "${GITHUB_REF_NAME}" != "main" ]; then
              echo "::error::Une version se publie depuis la branche main."
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
              echo "::error::La version v$version est déjà publiée : augmenter config/version dans project.godot."
              exit 1
            fi
            echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_NAME}" = "main" ]; then
            # Publication automatique : un nouveau numéro de version arrive sur main.
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
              echo "Version v$version déjà publiée : rien à publier."
            else
              echo "Nouvelle version v$version : elle sera publiée."
              echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
            fi
          fi

      - name: Vérifier le changelog
        run: |
          version="${{ steps.version.outputs.version }}"
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
              echo "::error::La version v$version publiée n'a pas de section dans CHANGELOG.md."
              exit 1
            fi
            # Les cartes PlaniFiKateur augmentent la version sans écrire le
            # changelog : la publication rédigera alors la section elle-même.
            echo "::warning file=CHANGELOG.md::Pas de section « ## [$version] » dans CHANGELOG.md : elle sera rédigée à partir des commits lors de la publication."
          fi

      - name: Installer Godot et les modèles d'export
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          rm -f *.zip *.tpz

      - name: Importer le projet
        run: godot --headless --import

      - name: Test des profils et des données
        run: godot --headless --path . --script res://tests/test_profiles.gd

      - name: Test (course jouée automatiquement)
        run: godot --headless --path . --script res://tests/autoplay.gd -- --fast

      - name: Exporter pour Windows et Linux
        run: |
          mkdir -p build/windows build/linux
          godot --headless --export-release "Windows" build/windows/FunKart.exe
          godot --headless --export-release "Linux" build/linux/FunKart.x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: FunKart-Windows
          path: build/windows/FunKart.exe

      - uses: actions/upload-artifact@v4
        with:
          name: FunKart-Linux
          path: build/linux/FunKart.x86_64

      - name: Préparer les fichiers de la version
        if: env.RELEASE_TAG != ''
        run: |
          cd build/windows && zip -9 ../FunKart-${RELEASE_TAG}-Windows.zip FunKart.exe && cd ../..
          cd build/linux && zip -9 ../FunKart-${RELEASE_TAG}-Linux.zip FunKart.x86_64

      - name: Préparer le changelog de la version
        if: env.RELEASE_TAG != ''
        id: changelog
        run: |
          version="${RELEASE_TAG#v}"
          etat=$(.github/scripts/changelog.sh "$version" build/changelog-version.md)
          echo "genere=$([ "$etat" = genere ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          {
            echo "**Pour jouer sous Windows** : télécharger \`FunKart-${RELEASE_TAG}-Windows.zip\`, le dézipper, puis double-cliquer sur \`FunKart.exe\`."
            echo "Si Windows affiche « Windows a protégé votre ordinateur » : « Informations complémentaires » puis « Exécuter quand même »."
            echo
            echo "## Nouveautés de la version ${version}"
            echo
            cat build/changelog-version.md
            echo
            echo "Historique complet : [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${RELEASE_TAG}/CHANGELOG.md)"
          } > build/release-notes.md
          cat build/release-notes.md

      - name: Enregistrer le changelog sur main
        # Seulement si la section a été rédigée automatiquement.
        if: env.RELEASE_TAG != '' && steps.changelog.outputs.genere == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "Changelog de la version ${RELEASE_TAG}"
          if ! git push origin HEAD:refs/heads/main; then
            echo "::warning::CHANGELOG.md n'a pas pu être enregistré sur main (main a changé ou est protégée) : ajouter la section ${RELEASE_TAG} à la main."
            git reset -q --hard HEAD~1
          fi

      - name: Créer le tag de la version
        if: env.RELEASE_TAG != ''
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "Le tag ${RELEASE_TAG} existe déjà."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          # Tag annoté portant le changelog de la version ; il désigne le
          # commit (avec CHANGELOG.md à jour s'il vient d'être enregistré).
          git tag -a "${RELEASE_TAG}" -F build/changelog-version.md HEAD
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Publier la version sur GitHub
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: FunKart ${{ env.RELEASE_TAG }}
          body_path: build/release-notes.md
          # FunKart.exe seul est aussi joint : PlaniFiKateur l'archive dans Google Drive.
          # CHANGELOG.md donne l'historique de toutes les versions.
          files: |
            build/FunKart-${{ env.RELEASE_TAG }}-Windows.zip
            build/FunKart-${{ env.RELEASE_TAG }}-Linux.zip
            build/windows/FunKart.exe
            CHANGELOG.md
